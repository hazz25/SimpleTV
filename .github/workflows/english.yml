name: English game

# Builds the Android version of "Next Stop: London" and publishes the web version on GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "english/**"
      - "englishapp/**"
      - ".github/workflows/english.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decrypt signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Le secret SIGNING_KEY est manquant."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
            -in keystore/simpletv.jks.enc -out keystore/simpletv.jks -pass env:SIGNING_KEY

      - name: Build
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: gradle :englishapp:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Prepare APK
        run: |
          cp englishapp/build/outputs/apk/release/englishapp-release.apk NextStopLondon.apk
          rm -f keystore/simpletv.jks
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify NextStopLondon.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Version 1.0.${{ github.run_number }}

          Next Stop: London, le jeu pour apprendre l'anglais. Téléchargez NextStopLondon.apk et installez-le."
          if gh release view english > /dev/null 2>&1; then
            gh release edit english --notes "$NOTES" --title "Next Stop: London (anglais)"
          else
            gh release create english --title "Next Stop: London (anglais)" --notes "$NOTES" --latest=false --prerelease
          fi
          gh release upload english NextStopLondon.apk --clobber

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: |
          mkdir -p site/english
          cp -r english/* site/english/
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Simple TV & Next Stop: London</title>
          <style>body{margin:0;min-height:100vh;font:17px/1.5 system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,#0b1020,#2a1240);display:flex;align-items:center;justify-content:center}main{max-width:520px;padding:24px}a{display:block;margin:12px 0;padding:16px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;text-decoration:none;font-weight:700}a span{display:block;font-weight:400;color:#a9b4c8;font-size:14px}</style></head>
          <body><main><h1>Mes applications</h1>
          <a href="english/">🇬🇧 Next Stop: London<span>Apprendre l'anglais en jouant, sur téléphone ou PC</span></a>
          <a href="https://github.com/hazz25/SimpleTV/releases/download/english/NextStopLondon.apk">📱 Next Stop: London pour Android<span>Avec la voix et le micro d'Android</span></a>
          <a href="https://github.com/hazz25/SimpleTV/releases/latest/download/SimpleTV.apk">📺 Simple TV pour Android TV<span>Code Downloader : 8977165</span></a>
          <a href="https://github.com/hazz25/SimpleTV/releases/download/desktop/SimpleTV-Setup.exe">💻 Simple TV pour Windows<span>Installation en quelques secondes</span></a>
          </main></body></html>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
