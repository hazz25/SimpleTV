name: Free lists

# Rebuilds the free channel list and the public-domain films every night,
# so the "Chaînes gratuites" option stays up to date without a new app version.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/free_lists.py
      - .github/workflows/free-lists.yml

permissions:
  contents: write

concurrency:
  group: free-lists
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sources
        run: |
          git clone --depth 1 https://github.com/Free-TV/IPTV.git /tmp/freetv
          git clone --depth 1 https://github.com/iptv-org/iptv.git /tmp/iptv
          git clone --depth 1 https://github.com/iptv-org/database.git /tmp/iptvdb

      - name: Build lists
        run: python3 tools/free_lists.py free /tmp/freetv /tmp/iptv /tmp/iptvdb

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Listes gratuites du $(date -u +%Y-%m-%d)"
            git push
          fi
