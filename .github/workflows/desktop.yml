name: Build Windows app

# Builds SimpleTV.exe (portable: nothing to install) and publishes it in the "desktop" release.
# That release is never marked "latest", so the Android download link keeps pointing at the APK.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Set version
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --publish never

      - name: Check the package
        run: |
          ls -la dist
          npx --yes @electron/asar list dist/win-unpacked/resources/app.asar > files.txt
          for f in /src/index.html /src/app.js /node_modules/hls.js/dist/hls.min.js /node_modules/mpegts.js/dist/mpegts.js; do
            grep -qx "$f" files.txt || grep -qx "${f//\//\\\\}" files.txt || { echo "Missing $f"; head -50 files.txt; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleTV-Windows
          path: desktop/dist/SimpleTV.exe

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Version 1.0.${{ github.run_number }}

          Simple TV pour Windows 10 et 11 : téléchargez SimpleTV.exe et ouvrez-le, rien à installer."
          if gh release view desktop > /dev/null 2>&1; then
            gh release edit desktop --notes "$NOTES" --title "Simple TV pour Windows"
          else
            gh release create desktop --title "Simple TV pour Windows" --notes "$NOTES" --latest=false --prerelease
          fi
          gh release upload desktop dist/SimpleTV.exe --clobber
