name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "free/**"
      - "tools/**"
      - ".github/workflows/free-lists.yml"
      - "README.md"
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decrypt signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Le secret SIGNING_KEY est manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
            -in keystore/simpletv.jks.enc -out keystore/simpletv.jks -pass env:SIGNING_KEY

      - name: Build
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Check signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk SimpleTV.apk
          rm -f keystore/simpletv.jks

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleTV
          path: SimpleTV.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" SimpleTV.apk \
            --title "Simple TV 1.0.${{ github.run_number }}" \
            --notes "Version compilée automatiquement." \
            --latest
